<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finora · Kết nối Open Banking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../_shared/base.css"/>
  <link rel="stylesheet" href="../../../ui-sample-3/styles.css"/>
  <script src="../../_shared/icons.js"></script>

  <style>
    body {
      background: var(--dash-bg);
      color: var(--foreground);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 40px;
    }
    .page-wrap {
      max-width: 480px;
      margin: 0 auto;
      background: var(--dash-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--foreground);
      background: #fff;
    }
    .tx-hdr {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .tx-back {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--dash-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--foreground);
      text-decoration: none;
      transition: background 0.15s;
    }
    .tx-back:hover { background: var(--border); }
    .tx-hdr-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.4px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      background: oklch(0.68 0.18 155 / 0.12);
      color: var(--success);
      font-size: 11px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <!-- Status bar -->
    <div class="sbar">
      <span>9:41</span>
      <span>● ● ●</span>
    </div>

    <!-- Header -->
    <div class="tx-hdr">
      <a href="../wallets/list.html" class="tx-back" title="Quay lại">
        <svg class="ic"><use href="#icon-chevron-left"/></svg>
      </a>
      <div class="tx-hdr-title">Đồng bộ Open Banking</div>
    </div>

    <div style="padding:16px;">
      <div style="background:#fff;border-radius:22px;border:1px solid var(--border);padding:20px;text-align:center;box-shadow:0 4px 14px rgba(15,23,42,.04);margin-bottom:16px;">
        <div style="width:64px;height:64px;border-radius:20px;background:oklch(0.55 0.18 250 / 0.12);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">
          <svg class="ic" style="width:32px;height:32px;"><use href="#icon-shield-check"/></svg>
        </div>
        <div style="font-size:17px;font-weight:900;margin-bottom:4px;">Vietcombank API Sync</div>
        <div style="font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:12px;">Kết nối trực tiếp chuẩn bảo mật 256-bit SSL</div>
        <div class="status-badge">
          <svg class="ic" style="width:12px;height:12px;"><use href="#icon-check-circle-2"/></svg>
          Đang kết nối tự động (Real-time)
        </div>
      </div>

      <div style="background:#fff;border-radius:18px;border:1px solid var(--border);padding:4px 16px;margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span style="color:var(--ink-soft);font-weight:700;">Tự động đọc biến động số dư</span>
          <input type="checkbox" checked style="accent-color:var(--primary);width:18px;height:18px;"/>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span style="color:var(--ink-soft);font-weight:700;">AI Nora tự gán danh mục</span>
          <input type="checkbox" checked style="accent-color:var(--primary);width:18px;height:18px;"/>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:13px;">
          <span style="color:var(--ink-soft);font-weight:700;">Lần đồng bộ cuối</span>
          <span style="font-weight:800;">12:30 hôm nay</span>
        </div>
      </div>

      <button class="btn btn-p" onclick="alert('Đã ép làm mới và tải các giao dịch mới nhất từ Vietcombank!')" style="padding:15px;border-radius:16px;margin-bottom:10px;">
        <svg class="ic"><use href="#icon-refresh-cw"/></svg> Đồng bộ ngay bây giờ
      </button>

      <button class="btn btn-sm-soft danger" onclick="alert('Đã hủy liên kết Open Banking thành công.')" style="width:100%;padding:14px;border-radius:16px;">
        Hủy liên kết tài khoản
      </button>
    </div>
  </div>
</body>
</html>
