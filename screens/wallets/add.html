<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finora · Thêm ví mới</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../_shared/base.css"/>
  <link rel="stylesheet" href="../../../ui-sample-3/styles.css"/>
  <script src="../../_shared/icons.js"></script>

  <style>
    body {
      background: var(--dash-bg);
      color: var(--foreground);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding-bottom: 40px;
    }
    .page-wrap {
      max-width: 480px;
      margin: 0 auto;
      background: var(--dash-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--foreground);
      background: #fff;
    }
    .tx-hdr {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .tx-back {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--dash-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--foreground);
      text-decoration: none;
      transition: background 0.15s;
    }
    .tx-back:hover { background: var(--border); }
    .tx-hdr-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.4px;
    }
    .type-pill-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .tp-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tp-card.on {
      border-color: var(--primary);
      background: var(--accent);
      color: var(--primary);
      font-weight: 800;
    }
    .form-group {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 4px 16px;
      margin-bottom: 16px;
    }
    .form-field {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .form-field:last-child { border-bottom: none; }
    .form-lbl {
      font-size: 11px;
      font-weight: 800;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .form-inp {
      width: 100%;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--foreground);
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <!-- Status bar -->
    <div class="sbar">
      <span>9:41</span>
      <span>● ● ●</span>
    </div>

    <!-- Header -->
    <div class="tx-hdr">
      <a href="list.html" class="tx-back" title="Quay lại">
        <svg class="ic"><use href="#icon-chevron-left"/></svg>
      </a>
      <div class="tx-hdr-title">Thêm ví & Nguồn tiền</div>
    </div>

    <div style="padding:16px;">
      <div style="font-size:11px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">
        Chọn loại nguồn tiền
      </div>

      <div class="type-pill-grid">
        <div class="tp-card on" onclick="selectType(this)">
          <svg class="ic"><use href="#icon-landmark"/></svg>
          <span>Tài khoản ngân hàng</span>
        </div>
        <div class="tp-card" onclick="selectType(this)">
          <svg class="ic"><use href="#icon-smartphone"/></svg>
          <span>Ví điện tử</span>
        </div>
        <div class="tp-card" onclick="selectType(this)">
          <svg class="ic"><use href="#icon-wallet"/></svg>
          <span>Tiền mặt</span>
        </div>
        <div class="tp-card" onclick="selectType(this)">
          <svg class="ic"><use href="#icon-piggy-bank"/></svg>
          <span>Sổ tiết kiệm</span>
        </div>
      </div>

      <div class="form-group">
        <div class="form-field">
          <div class="form-lbl">Tên ví / Tài khoản</div>
          <input type="text" class="form-inp" value="Techcombank Priority" placeholder="VD: MB Bank, Tiền tiêu vặt..." />
        </div>
        <div class="form-field">
          <div class="form-lbl">Số dư ban đầu</div>
          <input type="text" class="form-inp" value="₫ 5,000,000" style="font-family:'Outfit',sans-serif;font-size:18px;font-weight:900;color:var(--primary);" />
        </div>
        <div class="form-field">
          <div class="form-lbl">Đơn vị tiền tệ</div>
          <select class="form-inp" style="appearance:none;cursor:pointer;">
            <option>VND (₫) · Việt Nam Đồng</option>
            <option>USD ($) · Đô la Mỹ</option>
            <option>JPY (¥) · Yên Nhật</option>
          </select>
        </div>
      </div>

      <button class="btn btn-p" onclick="saveNewWallet()" style="padding:15px;border-radius:16px;">
        <svg class="ic"><use href="#icon-check"/></svg>
        Tạo nguồn tiền ngay
      </button>
    </div>
  </div>

  <script>
    function selectType(el) {
      document.querySelectorAll('.tp-card').forEach(function(c) { c.classList.remove('on'); });
      el.classList.add('on');
    }

    function saveNewWallet() {
      alert('Đã thêm nguồn tiền thành công vào danh mục của bạn!');
      window.location.href = 'list.html';
    }
  </script>
</body>
</html>
