<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finora · Khởi đầu cùng AI Mascot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../_shared/base.css" />
  <link rel="stylesheet" href="../../_shared/components.css" />
  <script src="../../_shared/icons.js"></script>

  <style>
    /* ============================================================
   Nora · Welcome / Mascot lineup — chuẩn hóa theo theme (styles.css)
   Dùng thay cho toàn bộ khối <style> inline của trang.
   ============================================================ */
    :root {
      /* Token gốc của theme */
      --primary: oklch(0.55 0.18 250);
      --primary-deep: oklch(0.42 0.14 250);
      --primary-soft: oklch(0.62 0.16 250);
      --secondary: oklch(0.78 0.16 65);
      --violet: oklch(0.55 0.2 285);
      --ink: oklch(0.28 0.05 240);
      --r-xl: 32px;
      --r-lg: 24px;
      --r-md: 16px;
      --r-sm: 12px;
      /* Thay cho #f59e0b / rgba(37,99,235) / #fef08a lệch tông */
      --gold: var(--secondary);
      --gold-light: oklch(0.92 0.09 85);
      --glass: rgba(255, 255, 255, .14);
      --glass-line: rgba(255, 255, 255, .28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background: #F8FAFC;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Vòng tròn đồng tâm viền rõ nét & loang nhẹ Soft Glow */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none
    }

    body::before {
      width: 330px;
      height: 330px;
      border: 2px solid rgba(0, 114, 213, 0.25);
      background: radial-gradient(circle, rgba(0, 114, 213, 0.09) 0%, rgba(0, 114, 213, 0.02) 65%, transparent 80%);
      box-shadow: 0 0 50px rgba(0, 114, 213, 0.08);
      top: -85px;
      right: -75px
    }

    body::after {
      width: 230px;
      height: 230px;
      border: 2px solid rgba(248, 169, 51, 0.32);
      background: radial-gradient(circle, rgba(248, 169, 51, 0.11) 0%, rgba(248, 169, 51, 0.02) 65%, transparent 80%);
      box-shadow: 0 0 50px rgba(248, 169, 51, 0.09);
      bottom: 24%;
      left: -65px
    }

    /* Status bar */
    .sbar {
      position: relative;
      z-index: 10;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 24px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #0f172a;
    }

    .sbar .icons {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .main-wrapper {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 20px 20px;
      width: 100%;
      max-width: 440px;
      margin: 0 auto
    }

    /* Brand */
    .brand-section {
      text-align: center;
      padding-top: 4px
    }

    .badge-pill {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 16px;
      border-radius: 99px;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #0072D5;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 114, 213, 0.06);
    }

    .brand-title {
      font-family: 'Inter', sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1.2px;
      line-height: 1.15;
    }

    .brand-title .txt-blue {
      color: #0072D5;
      -webkit-text-fill-color: #0072D5;
    }

    .brand-title .txt-orange {
      color: #f8a933;
      -webkit-text-fill-color: #f8a933;
    }

    .brand-desc {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      margin: 8px auto 0;
      line-height: 1.55;
      max-width: 300px
    }

    /* Mascot lineup */
    .lineup-container {
      width: 100%;
      position: relative;
      margin: 26px 0 12px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .stage-floor {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      height: 38px;
      pointer-events: none;
      z-index: 1;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(0, 114, 213, 0.15) 0%, rgba(248, 169, 51, 0.12) 50%, transparent 80%)
    }

    .mascot-bubble {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: #ffffff;
      color: #0f172a;
      padding: 7px 14px;
      border-radius: var(--r-md);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      white-space: nowrap;
      max-width: 100%;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s cubic-bezier(.175, .885, .32, 1.275)
    }

    .mascot-bubble strong {
      color: #0072D5;
      font-weight: 900
    }

    .mascot-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #ffffff;
      border-bottom: 0
    }

    .mascot-bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .lineup {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      width: 100%;
      padding: 24px 0 6px;
      position: relative;
      z-index: 5
    }

    .char {
      width: 76px;
      text-align: center;
      position: relative;
      margin: 0 -17px;
      cursor: pointer;
      transition: transform .25s ease, filter .25s ease;
      animation: float 4s ease-in-out infinite;
      -webkit-tap-highlight-color: transparent
    }

    .char:hover,
    .char:focus-visible {
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, .45));
      outline: none
    }

    .char:nth-child(1),
    .char:nth-child(7) {
      z-index: 7;
      transform: scale(.84) translateY(12px)
    }

    .char:nth-child(2),
    .char:nth-child(6) {
      z-index: 8;
      transform: scale(.91) translateY(7px)
    }

    .char:nth-child(3),
    .char:nth-child(5) {
      z-index: 9;
      transform: scale(.98) translateY(3px)
    }

    .char:nth-child(4) {
      z-index: 12;
      transform: scale(1.15) translateY(-6px)
    }

    .char:nth-child(1) {
      animation-delay: -2.8s
    }

    .char:nth-child(2) {
      animation-delay: -1.9s
    }

    .char:nth-child(3) {
      animation-delay: -1s
    }

    .char:nth-child(4) {
      animation-delay: 0s
    }

    .char:nth-child(5) {
      animation-delay: -1.2s
    }

    .char:nth-child(6) {
      animation-delay: -2.1s
    }

    .char:nth-child(7) {
      animation-delay: -3s
    }

    /* Dùng thuộc tính `translate` riêng → không xung đột với transform xếp lớp, không gây reflow */
    @keyframes float {

      0%,
      100% {
        translate: 0 0
      }

      50% {
        translate: 0 -8px
      }
    }

    .mascot-svg-wrap {
      width: 76px;
      height: 98px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .mascot-svg-wrap svg {
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .3))
    }

    .char-shadow {
      width: 48px;
      height: 7px;
      margin: -2px auto 0;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.2) 0%, transparent 75%)
    }

    .char-name {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #475569;
      letter-spacing: .2px
    }

    .char:nth-child(4) .char-name {
      color: #0072D5;
      font-weight: 900;
      font-size: 12px
    }

    /* Màu dùng trong SVG */
    .eye {
      fill: #fff
    }

    .pupil {
      fill: oklch(0.28 0.05 240)
    }

    .highlight {
      fill: #fff
    }

    .blush {
      fill: oklch(0.75 0.13 25);
      opacity: .45
    }

    /* Action group */
    .action-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-main {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border-radius: var(--r-md);
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: transform .2s cubic-bezier(.16, 1, .3, 1), background .2s, box-shadow .2s
    }

    .btn-login {
      background: #0072D5;
      color: #ffffff;
      box-shadow: 0 8px 22px rgba(0, 114, 213, 0.28)
    }

    .btn-login:hover {
      background: #0060b5;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 114, 213, 0.35)
    }

    .btn-register {
      background: #ffffff;
      color: #0f172a;
      border: 1.5px solid #cbd5e1;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04)
    }

    .btn-register:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
      transform: translateY(-2px)
    }

    .btn-main:active {
      transform: scale(.98)
    }

    .btn-main:focus-visible {
      outline: 3px solid #0072D5;
      outline-offset: 3px
    }

    .home-indicator {
      width: 134px;
      height: 4px;
      background: rgba(15, 23, 42, 0.2);
      border-radius: 99px;
      margin: 12px auto 0
    }

    /* Responsive: màn hẹp thu nhỏ hàng mascot */
    @media (max-width:370px) {
      .char {
        width: 64px;
        margin: 0 -16px
      }

      .mascot-svg-wrap {
        width: 64px;
        height: 84px
      }

      .brand-title {
        font-size: 26px
      }

      .mascot-bubble {
        font-size: 11px;
        padding: 6px 10px
      }
    }

    @media (min-height:820px) {
      .lineup-container {
        margin: 40px 0 20px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .char {
        animation: none
      }

      .mascot-bubble {
        transition: none
      }
    }
  </style>
</head>

<body>

  <!-- iOS Status Bar -->
  <div class="sbar">
    <span>9:41</span>
    <div class="icons">
      <svg class="ic" style="width:14px;height:14px;">
        <use href="#icon-wifi" />
      </svg>
      <svg class="ic" style="width:15px;height:15px;">
        <use href="#icon-zap" />
      </svg>
    </div>
  </div>

  <!-- Main Screen Content Centered Vertically -->
  <div class="main-wrapper">

    <!-- Top Brand Header -->
    <header class="brand-section">
      <div class="badge-pill">
        <span>finora</span>
      </div>
      <h1 class="brand-title"><span class="txt-blue">Tài chính</span> <span class="txt-orange">thông minh</span></h1>
      <p class="brand-desc">Đồng hành cùng dàn trợ lý AI cá nhân hóa theo từng cấp bậc tài chính của bạn</p>
    </header>

    <!-- Staggered Mascot Lineup in the Center -->
    <div class="lineup-container">
      <div class="stage-floor"></div>

      <!-- Interactive Speech Bubble -->
      <div class="mascot-bubble" id="mascotBubble">
        <span id="bubbleText">Nói là xong, Nora lo phần còn lại!</span>
      </div>

      <div class="lineup" id="lineupRow">

        <!-- 1. Ash -->
        <div class="char" data-name="Ash" data-quote="Ghi chép từng đồng, vững vàng vượt khó!"
          onclick="showMascotQuote(this)">
          <div class="mascot-svg-wrap">
            <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(0, 20)">
                <path d="M 30 90 Q 40 40 100 40 Q 160 40 170 90 Q 180 170 100 160 Q 20 170 30 90 Z" fill="#a0aec0" />
                <rect x="130" y="110" width="25" height="25" rx="3" fill="#cbd5e0" transform="rotate(15 130 110)" />
                <line x1="125" y1="120" x2="160" y2="125" stroke="#4a5568" stroke-width="2" />
                <line x1="135" y1="110" x2="140" y2="140" stroke="#4a5568" stroke-width="2" />
                <line x1="145" y1="112" x2="150" y2="142" stroke="#4a5568" stroke-width="2" />
                <rect x="40" y="90" width="20" height="8" fill="#fbd38d" transform="rotate(-20 40 90)" />
                <rect x="45" y="85" width="8" height="20" fill="#fbd38d" transform="rotate(-20 45 85)" />
                <ellipse cx="65" cy="85" rx="16" ry="8" fill="#4a5568" opacity="0.3" />
                <ellipse cx="135" cy="85" rx="16" ry="8" fill="#4a5568" opacity="0.3" />
                <g transform="translate(65, 75)">
                  <circle cx="0" cy="0" r="14" fill="#e2e8f0" />
                  <path d="M -15 -5 Q 0 5 15 -5 L 15 -15 L -15 -15 Z" fill="#a0aec0" />
                  <circle cx="2" cy="2" r="5" class="pupil" />
                </g>
                <g transform="translate(135, 75)">
                  <circle cx="0" cy="0" r="14" fill="#e2e8f0" />
                  <path d="M -15 -5 Q 0 5 15 -5 L 15 -15 L -15 -15 Z" fill="#a0aec0" />
                  <circle cx="-2" cy="2" r="5" class="pupil" />
                </g>
                <path d="M 88 100 Q 95 95 100 100 T 112 100" fill="none" stroke="#2d3748" stroke-width="3"

            </svg>
          </div>
          <div class="char-shadow"></div>
          <div class="char-name">Ash</div>
        </div>

        <!-- 2. Penny -->
        <div class="char" data-name="Penny" data-quote="Mỗi đồng tiết kiệm là một bước thảnh thơi!"
          onclick="showMascotQuote(this)">
          <div class="mascot-svg-wrap">
            <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(0, 20)">
                <path d="M 40 80 Q 40 30 100 30 Q 160 30 160 80 Q 170 160 100 160 Q 30 160 40 80 Z" fill="#fefcbf" />
                <path d="M 60 130 Q 100 160 140 130" fill="none" stroke="#ed8936" stroke-width="12"

                  <circle cx="3" cy="3" r="8" class="pupil" />

                </g>
                <g transform="translate(130, 75)">
                  <circle cx="0" cy="0" r="18" class="eye" />
                  <circle cx="-3" cy="3" r="8" class="pupil" />
                  <circle cx="-1" cy="1" r="3" class="highlight" />
                </g>
                <path d="M 92 100 Q 100 95 108 100" fill="none" stroke="#2d3748" stroke-width="3"
                  stroke-linecap="round" />
                <rect x="96" y="100" width="8" height="4" rx="2" fill="#fff" stroke="#2d3748" stroke-width="1" />
                <path d="M 155 45 Q 160 55 155 60 Q 150 55 155 45 Z" fill="#63b3ed" opacity="0.8" />
                <g transform="translate(100, 140)">
                  <circle cx="-25" cy="-5" r="8" fill="#f6ad55" />
                  <circle cx="25" cy="-5" r="8" fill="#f6ad55" />
                  <circle cx="0" cy="0" r="22" fill="#ecc94b" stroke="#d69e2e" stroke-width="4" />

                  <circle cx="-15" cy="10" r="8" fill="#f6ad55" />
                  <circle cx="15" cy="10" r="8" fill="#f6ad55" />
                </g>
              </g>
            </svg>
          </div>
          <div class="char-shadow"></div>
          <div class="char-name">Penny</div>
        </div>

        <!-- 3. Sage -->
        <div class="char" data-name="Sage" data-quote="Cân bằng thu chi, tâm hồn an yên"
          onclick="showMascotQuote(this)">
          <div class="mascot-svg-wrap">
            <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(0, 20)">
                <path d="M 45 75 Q 45 25 100 25 Q 155 25 155 75 Q 165 155 100 155 Q 35 155 45 75 Z" fill="#e6fffa" />
                <path d="M 60 110 L 140 110 L 130 160 L 70 160 Z" fill="#b2f5ea" />

                  <circle cx="0" cy="-2" r="7" class="pupil" />

                </g>
                <g transform="translate(130, 75)">

                  <circle cx="15" cy="5" r="7" fill="#81e6d9" />
                </g>
              </g>
            </svg>
          </div>
          <div class="char-shadow"></div>
          <div class="char-name">Sage</div>
        </div>

        <!-- 4. Nora (Center, Chief AI, Front-most) -->
        <div class="char" data-name="Nora" data-quote="Nói là xong — Nora lo phần còn lại!"
          onclick="showMascotQuote(this)">
          <div class="mascot-svg-wrap">
            <svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(0, 20)">
                <circle cx="100" cy="90" r="80" fill="#3b82f6" opacity="0.35" />
                <path d="M 40 80 Q 40 30 100 30 Q 160 30 160 80 Q 165 160 100 160 Q 35 160 40 80 Z" fill="#0072d5" />
                <rect x="50" y="50" width="100" height="70" rx="35" fill="#ffffff" stroke="#f7fcff" stroke-width="4" />
                <g transform="translate(75, 80)">
                  <circle cx="0" cy="0" r="10" fill="#0055a9" />
                  <circle cx="2" cy="-2" r="3" fill="#fff" />
                </g>
                <g transform="translate(125, 80)">
                  <circle cx="0" cy="0" r="10" fill="#0055a9" />
                  <circle cx="2" cy="-2" r="3" fill="#fff" />
                </g>
                <path d="M 92 98 Q 100 104 108 98" fill="none" stroke="#0055a9" stroke-width="3"
                  stroke-linecap="round" />
                <g transform="translate(145, 30)">
                  <path d="M 0 10 Q -10 10 -10 20 Q -10 10 -20 10 Q -10 10 -10 0 Q -10 10 0 10 Z" fill="#f6e05e" />
                </g>
                <g transform="translate(57, 120)">
                  <path d="M 0 10 Q -10 10 -10 20 Q -10 10 -20 10 Q -10 10 -10 0 Q -10 10 0 10 Z" fill="#f6e05e"
                    transform="scale(0.6)" />
                </g>
                <path d="M 70 120 L 130 120 L 120 140 L 80 140 Z" fill="#fff" opacity="0.3" />
                <g transform="translate(100, 140)">
                  <circle cx="-24" cy="-4" r="9" fill="#d9e6ff" />
                  <circle cx="24" cy="-4" r="9" fill="#d9e6ff" />
                  <g transform="translate(0, 0) scale(0.72)">
                    <rect x="-24" y="-16" width="48" height="32" rx="6" fill="#ffffff" stroke="#b8c2d4"
                      stroke-width="4" />
                    <rect x="-24" y="-16" width="48" height="13" rx="6" fill="#0072d5" />
                    <rect x="-24" y="-3" width="48" height="4" fill="#c9d3e2" />
                    <rect x="-16" y="-9" width="10" height="8" rx="2" fill="#f5c04a" />

  <script>
    var bubbleTimeout = null;

    function showMascotQuote(charElem) {
      var quote = charElem.getAttribute('data-quote') || "Xin chào bạn!";
      var name = charElem.getAttribute('data-name') || "Mascot";
      var bubble = document.getElementById('mascotBubble');
      var bubbleText = document.getElementById('bubbleText');

      bubbleText.innerHTML = "<strong>" + name + ":</strong> " + quote;
      bubble.classList.add('show');

      // Add a quick bounce animation to the clicked mascot
      charElem.style.transform = 'scale(1.28) translateY(-14px)';
      setTimeout(function () {
        charElem.style.transform = '';
      }, 400);

      if (bubbleTimeout) clearTimeout(bubbleTimeout);
      bubbleTimeout = setTimeout(function () {
        bubble.classList.remove('show');
      }, 3500);
    }

    // Auto-show Nora's speech bubble on start
    window.addEventListener('load', function () {
      setTimeout(function () {
        var nora = document.querySelector('.char:nth-child(4)');
        if (nora) showMascotQuote(nora);
      }, 800);
    });
  </script>
