<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finora · Đăng ký tài khoản</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../../_shared/base.css" />
  <link rel="stylesheet" href="../../_shared/components.css" />
  <script src="../../_shared/icons.js"></script>

  <style>
    /* ui-sample-3 theme */
    :root {
      --primary: oklch(0.55 0.18 250);
      --primary-fore: oklch(0.99 0.01 250);
      --secondary: oklch(0.78 0.16 65);
      --background: oklch(0.99 0.01 230);
      --foreground: oklch(0.25 0.06 240);
      --muted-fore: oklch(0.55 0.02 240);
      --accent: oklch(0.55 0.18 250 / 0.12);
      --primary-glow: oklch(0.55 0.18 250 / 0.32);
      --border: oklch(0.92 0.01 240);
      --dash-bg: oklch(0.97 0.01 240);
      --ink: oklch(0.28 0.05 240);
      --ink-soft: oklch(0.60 0.02 240);
      --ink-faint: oklch(0.75 0.02 240);
      --r-md: 16px;
      --r-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: var(--dash-bg);
      color: var(--foreground);
      display: flex;
      flex-direction: column;
    }

    .auth-wrap {
      min-height: 100vh;
      background: linear-gradient(170deg, oklch(0.42 0.14 250), oklch(0.55 0.18 250) 60%, oklch(0.68 0.13 250));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .auth-wrap::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      top: -80px;
      right: -60px;
      pointer-events: none;
    }

    .top-nav {
      position: relative;
      z-index: 10;
      padding: 12px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .back-btn-light {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
      transition: all 0.15s;
    }

    .back-btn-light:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .auth-mark {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 14px 20px 20px;
    }

    .auth-logo {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
      position: relative;
    }

    .auth-logo svg.logo-icon {
      width: 40px;
      height: 40px;
      color: #ffffff;
    }

    .auth-logo .spark-tag {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #f59e0b;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      border: 2px solid #fff;
    }

    .auth-logo-title {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.6px;
    }

    .auth-logo-sub {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
      font-weight: 600;
    }

    /* Auth Bottom Sheet */
    .auth-sheet {
      background: #ffffff;
      border-radius: 32px 32px 0 0;
      padding: 26px 24px 30px;
      position: relative;
      z-index: 2;
      width: 100%;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.12);
    }

    .auth-sheet h2 {
      font-size: 23px;
      font-weight: 900;
      color: var(--foreground);
      letter-spacing: -0.6px;
    }

    .auth-sheet .sub {
      font-size: 12.5px;
      color: var(--ink-soft);
      margin-top: 3px;
      margin-bottom: 18px;
    }

    .form-g {
      margin-bottom: 14px;
    }

    .form-lbl {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: var(--ink-soft);
      margin-bottom: 5px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      border-radius: var(--r-sm);
      background: var(--dash-bg);
      border: 1.5px solid var(--border);
      transition: all 0.2s;
    }

    .field:focus-within {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px var(--accent);
    }

    .field .ic {
      width: 17px;
      height: 17px;
      color: var(--ink-soft);
      flex-shrink: 0;
    }

    .field input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
    }

    .hint-note {
      font-size: 11px;
      color: var(--primary);
      font-weight: 700;
      margin-top: -6px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Primary Button */
    .btn-p {
      width: 100%;
      padding: 15px 22px;
      border-radius: var(--r-md);
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px var(--primary-glow);
      transition: all 0.2s;
    }

    .btn-p:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .btn-p:active {
      transform: scale(0.98);
    }

    .auth-foot {
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
      font-weight: 600;
      margin-top: 18px;
    }

    .auth-foot a {
      color: var(--primary);
      font-weight: 800;
      text-decoration: none;
      margin-left: 4px;
    }

    .auth-foot a:hover {
      text-decoration: underline;
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #0f172a;
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 100;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
  </style>
</head>

<body>

  <!-- Toast -->
  <div class="toast-box" id="toast">
    <div class="toast-dot"></div>
    <span id="toastMsg">Tạo tài khoản thành công! Bắt đầu Onboarding...</span>
  </div>

  <div class="auth-wrap">

    <!-- Top status & back button -->
    <div>
      <div class="sbar light">
        <span>9:41</span>
        <div class="icons">
          <svg class="ic" style="width:14px;height:14px;">
            <use href="#icon-wifi" />
          </svg>
          <svg class="ic" style="width:14px;height:14px;">
            <use href="#icon-zap" />
          </svg>
        </div>
      </div>

      <div class="top-nav">
        <a href="welcome.html" class="back-btn-light" title="Quay lại">
          <svg class="ic" style="width:18px;height:18px;">
            <use href="#icon-chevron-left" />
          </svg>
        </a>
        <div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:0.8;">Tạo tài
          khoản</div>
        <div style="width:36px;"></div>
      </div>

      <!-- Auth Hero / Brand Mark -->
      <div class="auth-mark">
        <div class="auth-logo">
          <svg class="logo-icon">
            <use href="#icon-user" />
          </svg>
          <div class="spark-tag">✦</div>
        </div>
        <div class="auth-logo-title">Finora ID</div>
        <div class="auth-logo-sub">Gia nhập hệ sinh thái 7 trợ lý AI</div>
      </div>
    </div>

    <!-- Registration Bottom Sheet -->
    <div class="auth-sheet">
      <h2>Đăng ký tài khoản</h2>
      <p class="sub">Nhập thông tin bất kỳ để trải nghiệm luồng Onboarding</p>

      <form id="regForm" onsubmit="handleRegister(event)">
        <!-- Name Field -->
        <div class="form-g">
          <label class="form-lbl" for="fullName">Họ và tên</label>
          <div class="field">
            <svg class="ic">
              <use href="#icon-user" />
            </svg>
            <input type="text" id="fullName" value="Nguyễn Văn A" placeholder="Nhập tên của bạn (tùy ý)" />
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-g">
          <label class="form-lbl" for="regEmail">Email</label>
          <div class="field">
            <svg class="ic">
              <use href="#icon-mail" />
            </svg>
            <input type="text" id="regEmail" value="user.finora@gmail.com" placeholder="Email (nhập bừa vẫn được)" />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-g">
          <label class="form-lbl" for="regPassword">Mật khẩu</label>
          <div class="field">
            <svg class="ic">
              <use href="#icon-lock" />
            </svg>
            <input type="password" id="regPassword" value="123456" placeholder="Mật khẩu bất kỳ" />
          </div>
        </div>

        <!-- Register Button (Redirects to Onboarding) -->
        <button type="submit" class="btn-p" id="regBtn">
          <span>Đăng ký &amp; Khám phá Onboarding</span>
          <svg class="ic">
            <use href="#icon-arrow-up-right" />
          </svg>
        </button>
      </form>

      <!-- Foot login link -->
      <div class="auth-foot">
        Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
      </div>
    </div>

  </div>

  <script>
    function showToast(msg, callback) {
      var toast = document.getElementById('toast');
      var toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.add('show');
      setTimeout(function () {
        if (callback) callback();
      }, 900);
    }

    function handleRegister(e) {
      if (e) e.preventDefault();
      var btn = document.getElementById('regBtn');
      btn.innerHTML = '<span>Đang thiết lập hồ sơ...</span>';
      btn.style.opacity = '0.85';
      btn.style.pointerEvents = 'none';

      // Store any name entered or fallback
      var name = document.getElementById('fullName').value || "Nguyễn Văn A";
      try {
        sessionStorage.setItem('finora_user_name', name);
      } catch (err) { }

      showToast("Đăng ký thành công! Bắt đầu Onboarding...", function () {
        window.location.href = "../onboarding/welcome.html";
      });
    }
  </script>
</body>

</html>
