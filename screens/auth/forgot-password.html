<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finora · Quên mật khẩu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../_shared/base.css" />
  <link rel="stylesheet" href="../../_shared/components.css" />
  <script src="../../_shared/icons.js"></script>

  <style>
    :root {
      --primary: oklch(0.55 0.18 250);
      --primary-glow: oklch(0.55 0.18 250 / 0.32);
      --border: oklch(0.92 0.01 240);
      --dash-bg: oklch(0.97 0.01 240);
      --foreground: oklch(0.25 0.06 240);
      --ink-soft: oklch(0.60 0.02 240);
      --r-md: 16px;
      --r-sm: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: var(--dash-bg);
      color: var(--foreground);
    }
    .auth-wrap {
      min-height: 100vh;
      background: linear-gradient(170deg, oklch(0.42 0.14 250), oklch(0.55 0.18 250) 60%, oklch(0.68 0.13 250));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .top-nav {
      position: relative;
      z-index: 10;
      padding: 12px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    .back-btn-light {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-decoration: none;
    }
    .auth-mark {
      text-align: center;
      padding: 20px;
      color: #fff;
    }
    .auth-logo {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      color: #fff;
    }
    .auth-sheet {
      background: #ffffff;
      border-radius: 32px 32px 0 0;
      padding: 28px 24px 34px;
      position: relative;
      z-index: 2;
      width: 100%;
    }
    .form-lbl {
      display: block;
      font-size: 11px;
      font-weight: 800;
      color: var(--ink-soft);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--r-sm);
      background: var(--dash-bg);
      border: 1.5px solid var(--border);
      margin-bottom: 20px;
    }
    .field input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
    }
    .btn-p {
      width: 100%;
      padding: 15px 22px;
      border-radius: var(--r-md);
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 24px var(--primary-glow);
    }
    .auth-foot {
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
      font-weight: 600;
      margin-top: 20px;
    }
    .auth-foot a {
      color: var(--primary);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div>
      <div class="sbar light">
        <span>9:41</span>
        <div class="icons">
          <svg class="ic" style="width:14px;height:14px;"><use href="#icon-wifi"/></svg>
          <svg class="ic" style="width:14px;height:14px;"><use href="#icon-battery"/></svg>
        </div>
      </div>
      <div class="top-nav">
        <a href="login.html" class="back-btn-light" title="Quay lại">
          <svg class="ic" style="width:18px;height:18px;"><use href="#icon-chevron-left"/></svg>
        </a>
        <div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:0.8;">Khôi phục</div>
        <div style="width:36px;"></div>
      </div>
      <div class="auth-mark">
        <div class="auth-logo">
          <svg class="ic" style="width:36px;height:36px;"><use href="#icon-key-round"/></svg>
        </div>
        <h2 style="font-size:26px;font-weight:900;">Quên mật khẩu</h2>
        <p style="font-size:12.5px;color:rgba(255,255,255,0.8);margin-top:4px;">Nhận mã xác nhận qua email của bạn</p>
      </div>
    </div>

    <div class="auth-sheet">
      <h3 style="font-size:20px;font-weight:900;margin-bottom:6px;">Đặt lại mật khẩu</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;">Vui lòng nhập email đăng ký tài khoản Finora</p>

      <form onsubmit="event.preventDefault(); alert('Mã xác nhận đã gửi đến email của bạn!'); window.location.href='login.html';">
        <label class="form-lbl">Email tài khoản</label>
        <div class="field">
          <svg class="ic"><use href="#icon-mail"/></svg>
          <input type="email" value="nguyenvana@gmail.com" required />
        </div>

        <button type="submit" class="btn-p">
          <span>Gửi liên kết khôi phục</span>
          <svg class="ic"><use href="#icon-send"/></svg>
        </button>
      </form>

      <div class="auth-foot">
        Nhớ mật khẩu rồi? <a href="login.html">Quay lại đăng nhập</a>
      </div>
    </div>
  </div>
</body>
</html>
